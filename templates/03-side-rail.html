<!--
  قالب: الشريط الجانبي
  شريط جانبي بخطوات، بيفضل ظاهر لقسم كامل

  اللي تغيّره: غيّر الخطوات وعدد العناصر. AT فيها توقيت كل خطوة — واحد لكل خطوة.
  التوقيت: كل رقم في AT (أو في نداءات rise) هو ثواني من بداية المشهد، بتاخدها من words.txt.
  الحجم: مش محتاج تحدّد scale — الكيت بياخده من project.json.
-->
<meta charset="utf-8"><title>الشريط الجانبي</title>
<link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../tokens/digitalflow.css"><link rel="stylesheet" href="../scenes/base.css">
<style>
  /* A tall narrow panel pinned to the free edge of the frame. It stays up for a whole
     section — only the active row changes — so the viewer always knows where he is. */
  .rail { position:absolute; left:72px; top:180px; width:452px;
          background:var(--df-surface); border:1px solid var(--df-border);
          border-radius:var(--df-r-lg); box-shadow:var(--df-shadow-raised);
          padding:26px 24px; will-change:opacity,transform; }
  .rail .hd { font-size:19px; font-weight:700; color:var(--df-gray);
              letter-spacing:.4px; padding-bottom:14px; border-bottom:1px solid var(--df-divider); }
  .st  { display:flex; align-items:center; gap:14px; padding:13px 12px; margin-top:6px;
         border-radius:var(--df-r-md); will-change:opacity; }
  .st .n { flex:0 0 auto; width:34px; height:34px; border-radius:var(--df-r-pill);
           background:var(--df-divider); color:var(--df-gray);
           font-size:16px; font-weight:700;
           display:flex; align-items:center; justify-content:center; }
  .st .t { font-size:23px; font-weight:600; color:var(--df-gray-2); line-height:1.3; }
  .st.done .n { background:rgba(34,179,152,.14); color:#0B8A96; }
  .st.done .t { color:var(--df-gray); }
  .st.on  { background:var(--df-divider); }
  .st.on .n { background:var(--df-gradient); color:#fff; box-shadow:var(--df-shadow-glow); }
  .st.on .t { color:var(--df-ink); font-weight:700; }
</style>
<div class="rail" id="rail">
  <div class="hd">رحلة بناء النظام</div>
  <div class="st" data-s><span class="n">١</span><span class="t">تحدّد المشكلة</span></div>
  <div class="st" data-s><span class="n">٢</span><span class="t">تحسب قيمتها بالفلوس</span></div>
  <div class="st" data-s><span class="n">٣</span><span class="t">تكتب البرومبت</span></div>
  <div class="st" data-s><span class="n">٤</span><span class="t">تبني على Lovable</span></div>
  <div class="st" data-s><span class="n">٥</span><span class="t">تطلّعه أونلاين</span></div>
</div>
<script src="../scenes/anim.js"></script>
<script>
(() => {
  const { win, rise } = window.DF;
  const rail=document.getElementById('rail');
  const ss=[...document.querySelectorAll('[data-s]')];
  const AT=[1.2,6.0,11.5,17.0,22.5];   // one cue per stage, from the transcript
  const OUT=27.5;
  window.SCENE={ width:1920, height:1080, duration:28.2,
    seek(t){ const p=win(t,0,0.6);
      rail.style.opacity=p*(1-win(t,OUT,0.5));
      rail.style.transform=`translateX(${(1-p)*-60}px)`;   // slides in from the left edge
      ss.forEach((el,i)=>{
        el.style.opacity=win(t,AT[i]-0.2,0.4)*0.35+0.65;   // all visible, dim until reached
        el.classList.toggle('on',  t>=AT[i] && (i===ss.length-1 || t<AT[i+1]));
        el.classList.toggle('done',i<ss.length-1 && t>=AT[i+1]);
      });
    }
  };
  window.SCENE.seek(0);
})();
</script>
